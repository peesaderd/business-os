<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 - Ads Banner 1200x628</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a2e; font-family: 'Segoe UI', Tahoma, sans-serif; }
  .banner { width: 1200px; height: 628px; position: relative; overflow: hidden; background: linear-gradient(135deg, #0a0a23 0%, #1a1a4e 40%, #0d47a1 100%); }
  .stars { position: absolute; width: 100%; height: 100%; }
  .star { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; opacity: 0.7; }
  .glow { position: absolute; top: -100px; right: -100px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(255,215,0,0.15) 0%, transparent 70%); border-radius: 50%; }
  .glow2 { position: absolute; bottom: -150px; left: -100px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0,100,200,0.2) 0%, transparent 70%); border-radius: 50%; }
  .trophy { position: absolute; top: 50%; right: 60px; transform: translateY(-50%); font-size: 200px; filter: drop-shadow(0 0 40px rgba(255,215,0,0.5)); }
  .content { position: absolute; left: 60px; top: 50%; transform: translateY(-50%); max-width: 600px; }
  .year { font-size: 28px; color: #ffd700; letter-spacing: 8px; font-weight: 700; text-transform: uppercase; text-shadow: 0 0 20px rgba(255,215,0,0.4); }
  .title { font-size: 72px; font-weight: 900; color: #fff; line-height: 1.1; margin-top: 10px; text-shadow: 0 4px 30px rgba(0,0,0,0.5); }
  .title span { color: #ffd700; }
  .subtitle { font-size: 22px; color: rgba(255,255,255,0.8); margin-top: 20px; letter-spacing: 3px; font-weight: 300; }
  .date { font-size: 18px; color: #ffd700; margin-top: 30px; letter-spacing: 2px; font-weight: 600; border-left: 4px solid #ffd700; padding-left: 16px; }
  .cta { display: inline-block; margin-top: 30px; padding: 14px 40px; background: linear-gradient(135deg, #ffd700, #ffaa00); color: #0a0a23; font-size: 18px; font-weight: 700; border-radius: 50px; text-decoration: none; letter-spacing: 1px; box-shadow: 0 4px 25px rgba(255,215,0,0.4); }
  .footer { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; font-size: 11px; color: rgba(255,255,255,0.2); letter-spacing: 2px; }
  /* decorative lines */
  .line1 { position: absolute; top: 40px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,215,0,0.3), transparent); }
  .line2 { position: absolute; bottom: 50px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,215,0,0.2), transparent); }
  .corner { position: absolute; width: 40px; height: 40px; border-color: rgba(255,215,0,0.3); }
  .corner-tl { top: 20px; left: 20px; border-top: 2px solid; border-left: 2px solid; }
  .corner-tr { top: 20px; right: 20px; border-top: 2px solid; border-right: 2px solid; }
  .corner-bl { bottom: 20px; left: 20px; border-bottom: 2px solid; border-left: 2px solid; }
  .corner-br { bottom: 20px; right: 20px; border-bottom: 2px solid; border-right: 2px solid; }
  /* soccer ball pattern */
  .pentagon { position: absolute; opacity: 0.03; font-size: 60px; color: #fff; }
</style>
</head>
<body>
<div class="banner" id="banner">
  <!-- Background elements -->
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="line1"></div>
  <div class="line2"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  <div class="pentagon" style="top:10%;left:10%;">⚽</div>
  <div class="pentagon" style="top:70%;left:85%;">⚽</div>
  <div class="pentagon" style="top:80%;left:15%;">⚽</div>
  <div class="pentagon" style="top:15%;left:75%;">⚽</div>
  
  <!-- Decorative stars -->
  <div class="stars">
    <div class="star" style="top:5%;left:20%;width:3px;height:3px;"></div>
    <div class="star" style="top:15%;left:80%;"></div>
    <div class="star" style="top:30%;left:10%;width:3px;height:3px;"></div>
    <div class="star" style="top:45%;left:90%;"></div>
    <div class="star" style="top:60%;left:5%;width:2px;height:2px;"></div>
    <div class="star" style="top:75%;left:70%;"></div>
    <div class="star" style="top:85%;left:30%;"></div>
  </div>

  <!-- Trophy area -->
  <div class="trophy">🏆</div>

  <!-- Main content -->
  <div class="content">
    <div class="year">FIFA World Cup</div>
    <div class="title">THE GREATEST<br><span>SHOW ON EARTH</span></div>
    <div class="subtitle">⚽ UNITED · UNSTOPPABLE · UNFORGETTABLE</div>
    <div class="date">📅 JUNE 11 – JULY 19, 2026<br>🇺🇸 🇲🇽 🇨🇦 · 16 CITIES · 48 TEAMS</div>
    <div class="cta">GET READY →</div>
  </div>
  
  <div class="footer">© 2026 FIFA WORLD CUP · ALL RIGHTS RESERVED</div>
</div>
<script>
  // Add some animated sparkles
  (function() {
    const banner = document.getElementById('banner');
    const colors = ['#ffd700', '#ffffff', '#00a2ff'];
    for (let i = 0; i < 30; i++) {
      const sparkle = document.createElement('div');
      const size = Math.random() * 3 + 1;
      sparkle.style.cssText = `
        position: absolute;
        width: ${size}px;
        height: ${size}px;
        background: ${colors[i % 3]};
        border-radius: 50%;
        top: ${Math.random() * 100}%;
        left: ${Math.random() * 100}%;
        opacity: ${Math.random() * 0.5 + 0.1};
        animation: pulse ${Math.random() * 3 + 2}s ease-in-out infinite;
        animation-delay: ${Math.random() * 2}s;
      `;
      banner.appendChild(sparkle);
    }
  })();
</script>
</body>
</html>
